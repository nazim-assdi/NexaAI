name: Build Nexa AI Windows Offline Installer

concurrency:
  group: nexa-ai-windows-installer-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop.py"
      - "nexa_ai/**"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
      - "tests/**"
      - "plugin-template/**"
      - "plugins/**"
      - "README.md"
      - "THIRD-PARTY-NOTICES.txt"

permissions:
  contents: write
  actions: write

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      LLAMA_CPP_TAG: b12651
      LLAMA_RUNTIME_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12651/llama-b12651-bin-win-cpu-x64.zip
      LLAMA_RUNTIME_SHA256: b2d794fa7587aba29f654d717ff9b73e31caeabf50a7766692903008bbe0855d
      MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download official llama.cpp Windows CPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:LLAMA_RUNTIME_URL -OutFile "$env:RUNNER_TEMP\llama-runtime.zip"
          $runtimeHash = (Get-FileHash "$env:RUNNER_TEMP\llama-runtime.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeHash -ne $env:LLAMA_RUNTIME_SHA256) { throw "llama.cpp runtime SHA256 verification failed." }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\llama-runtime.zip" -DestinationPath "$env:RUNNER_TEMP\llama-runtime" -Force
          $server = Get-ChildItem -Path "$env:RUNNER_TEMP\llama-runtime" -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the official runtime archive." }
          New-Item -ItemType Directory -Force -Path "runtime" | Out-Null
          Copy-Item -Path (Join-Path $server.DirectoryName "*") -Destination "runtime" -Recurse -Force
          & "runtime\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe validation failed." }

      - name: Download bundled local language model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          curl.exe --fail --location --retry 5 --retry-delay 3 --output (Join-Path "models" $env:MODEL_FILE) $env:MODEL_URL
          if ($LASTEXITCODE -ne 0) { throw "Model download failed." }
          $model = Get-Item (Join-Path "models" $env:MODEL_FILE)
          if ($model.Length -lt 900MB) { throw "Model download is incomplete or unexpectedly small." }
          $hash = (Get-FileHash $model.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e") { throw "Bundled model checksum verification failed." }
          Write-Host "Bundled model size: $([math]::Round($model.Length / 1GB, 2)) GiB; SHA256 verified."
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/LICENSE" -OutFile "models\QWEN-LICENSE.txt"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile and run tests
        run: |
          python -m compileall -q nexa_ai desktop.py
          python -m unittest discover -s tests -v

      - name: Build self-contained desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyinstallerArgs = @(
            "--noconfirm", "--clean", "--windowed", "--onedir", "--name", "NexaAI",
            "--add-data", "models;models",
            "--add-data", "runtime;runtime",
            "--collect-all", "fastapi",
            "--collect-all", "uvicorn",
            "--collect-all", "pydantic",
            "--collect-all", "pypdf",
            "--collect-all", "multipart",
            "--collect-all", "imageio_ffmpeg",
            "--collect-all", "faster_whisper",
            "--collect-all", "ctranslate2",
            "--collect-all", "av",
            "--collect-all", "sounddevice",
            "--collect-all", "_sounddevice_data",
            "--collect-all", "_sounddevice_data",
            "--collect-all", "pyttsx3",
            "--collect-all", "comtypes",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--hidden-import", "comtypes.client",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "desktop.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if (-not (Test-Path "dist\NexaAI\NexaAI.exe")) { throw "Desktop application EXE was not produced." }
          if (-not (Test-Path "dist\NexaAI\_internal\models\$env:MODEL_FILE")) { throw "Model was not bundled into the desktop application." }
          if (-not (Test-Path "dist\NexaAI\_internal\runtime\llama-server.exe")) { throw "llama.cpp runtime was not bundled into the desktop application." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler "installer\NexaAI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Get-ChildItem output -Filter "NexaAI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Nexa AI installer was not produced." }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List | Out-File "output\SHA256.txt"
          Get-Item $installer.FullName | Select-Object Name,Length | Format-List

      - name: Upload installable software
        uses: actions/upload-artifact@v4
        with:
          name: NexaAI-Windows-x64-Offline-Installer
          path: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is the latest main commit
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main"
          if ($latest.sha -eq $env:GITHUB_SHA) {
            "is_latest=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Skipping release publish: a newer main commit exists."
            "is_latest=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release with installer
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.2.0
          name: Nexa AI Desktop v1.2.0 — Offline AI + Voice + n8n Studio
          body: |
            Installable Windows x64 build of Nexa AI. The CPU inference runtime and Qwen2.5 1.5B Q4_K_M model are bundled in the installer. After installation, the app starts its local model itself and does not need Ollama, Python, command-line setup, an API key, or an internet connection for local chat.

            The model is compact for low-memory PCs; response quality and generation speed are below larger cloud models. This first desktop build supports local chat and text/PDF document attachments.
          files: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          draft: false
          prerelease: false
          make_latest: true
