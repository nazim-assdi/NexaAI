name: Build Nexa AI Windows Offline Installer

concurrency:
  group: nexa-ai-windows-installer-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop.py"
      - "nexa_ai/**"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "plugin-template/**"
      - "plugins/**"
      - "README.md"
      - "THIRD-PARTY-NOTICES.txt"

permissions:
  contents: write
  actions: write

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          python tools/build_icon.py
          if (-not (Test-Path "assets/nexa-ai.ico")) { throw "NTech app icon was not generated." }

      - name: Compile and run tests
        run: |
          python -m compileall -q nexa_ai desktop.py tools/build_icon.py tools/smoke_test_runtime.py
          python -m unittest discover -s tests -v

      - name: Build self-contained desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyinstallerArgs = @(
            "--noconfirm", "--clean", "--windowed", "--onedir", "--name", "NexaAI",
            "--icon", "assets/nexa-ai.ico",
            "--collect-all", "fastapi",
            "--collect-all", "uvicorn",
            "--collect-all", "pydantic",
            "--collect-all", "pypdf",
            "--collect-all", "multipart",
            "--collect-all", "imageio_ffmpeg",
            "--collect-all", "faster_whisper",
            "--collect-all", "ctranslate2",
            "--collect-all", "av",
            "--collect-all", "sounddevice",
            "--collect-all", "_sounddevice_data",
            "--collect-all", "pyttsx3",
            "--collect-all", "comtypes",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--hidden-import", "comtypes.client",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "desktop.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if (-not (Test-Path "dist\NexaAI\NexaAI.exe")) { throw "Desktop application EXE was not produced." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler "installer\NexaAI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Get-ChildItem output -Filter "NexaAI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Nexa AI installer was not produced." }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List | Out-File "output\SHA256.txt"
          Get-Item $installer.FullName | Select-Object Name,Length | Format-List

      - name: Upload installable software
        uses: actions/upload-artifact@v4
        with:
          name: NexaAI-Windows-x64-Offline-Installer
          path: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is the latest main commit
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main"
          if ($latest.sha -eq $env:GITHUB_SHA) {
            "is_latest=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Skipping release publish: a newer main commit exists."
            "is_latest=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release with installer
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.8.0
          name: Nexa AI Desktop v1.8.0 — Ollama Gemma 3 1B
          body: |
            Installable Windows x64 build of NexaAI. This edition uses Ollama as its local runtime and Google Gemma 3 1B (gemma3:1b, about 806 MB) as its single chat model. Install Ollama for Windows from https://ollama.com/download/windows before launching NexaAI for the first time. NexaAI detects or starts the local Ollama service, downloads Gemma 3 1B automatically, and then runs chats locally. After the one-time runtime and model setup, chat works offline.

            The chat workspace supports queued follow-up messages (up to four waiting prompts), Quick/Balanced/Detailed reply lengths, bounded recent context, batched streaming updates, complete scrollable answers, copy controls, and readable headings/code blocks. Voice input uses a separate Whisper base speech-recognition component; Windows SAPI provides local speech output. Gemma 3 1B is a compact multilingual text model, so it is lighter and generally faster on older CPUs but less capable than larger models for complex multi-file coding. Image/video understanding and scanned-PDF OCR are not included.
          files: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          draft: false
          prerelease: false
          make_latest: true
