name: Build Nexa AI Windows Offline Installer

concurrency:
  group: nexa-ai-windows-installer-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop.py"
      - "nexa_ai/**"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "plugin-template/**"
      - "plugins/**"
      - "README.md"
      - "THIRD-PARTY-NOTICES.txt"

permissions:
  contents: write
  actions: write

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          python tools/build_icon.py
          if (-not (Test-Path "assets/nexa-ai.ico")) { throw "NTech app icon was not generated." }

      - name: Compile and run unit tests
        run: |
          python -m compileall -q nexa_ai desktop.py tools/build_icon.py tools/smoke_test_runtime.py
          python -m unittest discover -s tests -v

      - name: Download embedded Ollama runtime and Gemma 3 1B
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildAssets = Join-Path $PWD "build-assets"
          $ollamaDir = Join-Path $buildAssets "ollama"
          $modelDir = Join-Path $buildAssets "ollama-models"
          New-Item -ItemType Directory -Force -Path $ollamaDir, $modelDir | Out-Null

          $zipPath = Join-Path $env:TEMP "ollama-windows-amd64-rocm.zip"
          $url = "https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-windows-amd64-rocm.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $expectedHash = "ff309b427e81f6364178a6b5ba6a50697b7ee7e81f5f8c4f801752f4fdb060b6"
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Ollama runtime checksum mismatch: $actualHash" }

          Expand-Archive -Path $zipPath -DestinationPath $ollamaDir -Force
          $ollamaExe = Get-ChildItem -Path $ollamaDir -Filter "ollama.exe" -Recurse | Select-Object -First 1
          if (-not $ollamaExe) { throw "The official Ollama runtime archive did not contain ollama.exe." }
          if ($ollamaExe.DirectoryName -ne $ollamaDir) { throw "Unexpected Ollama archive layout: ollama.exe was not at the runtime root." }

          $licenseUrl = "https://raw.githubusercontent.com/ollama/ollama/v0.40.18/LICENSE"
          try { Invoke-WebRequest -Uri $licenseUrl -OutFile (Join-Path $ollamaDir "LICENSE") } catch {
            Write-Warning "Ollama archive license file was retained as provided by upstream."
          }

          $env:OLLAMA_MODELS = $modelDir
          $env:OLLAMA_HOST = "127.0.0.1:11439"
          $env:OLLAMA_KEEP_ALIVE = "30m"
          $server = Start-Process -FilePath $ollamaExe.FullName -ArgumentList "serve" -WorkingDirectory $ollamaDir -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                Invoke-RestMethod -Uri "http://127.0.0.1:11439/api/version" -TimeoutSec 3 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 2 }
              if ($server.HasExited) { throw "Bundled Ollama server exited with code $($server.ExitCode)." }
            }
            if (-not $ready) { throw "Bundled Ollama server did not become ready." }

            & $ollamaExe.FullName pull "gemma3:1b"
            if ($LASTEXITCODE -ne 0) { throw "Ollama could not download Gemma 3 1B." }

            $modelResponse = Invoke-RestMethod -Uri "http://127.0.0.1:11439/api/tags" -TimeoutSec 20
            if (-not ($modelResponse.models | Where-Object { $_.name -eq "gemma3:1b" -or $_.model -eq "gemma3:1b" })) {
              throw "Gemma 3 1B did not appear in the Ollama model list after download."
            }
            $modelBytes = (Get-ChildItem -Path $modelDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
            if ($modelBytes -lt 500MB) { throw "Gemma model cache looks incomplete: $modelBytes bytes." }
            Write-Host "Prepared Gemma 3 1B model cache: $([math]::Round($modelBytes / 1MB)) MB"
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Build self-contained desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyinstallerArgs = @(
            "--noconfirm", "--clean", "--windowed", "--onedir", "--name", "NexaAI",
            "--icon", "assets/nexa-ai.ico",
            "--collect-all", "fastapi",
            "--collect-all", "uvicorn",
            "--collect-all", "pydantic",
            "--collect-all", "pypdf",
            "--collect-all", "multipart",
            "--collect-all", "imageio_ffmpeg",
            "--collect-all", "faster_whisper",
            "--collect-all", "ctranslate2",
            "--collect-all", "av",
            "--collect-all", "sounddevice",
            "--collect-all", "_sounddevice_data",
            "--collect-all", "pyttsx3",
            "--collect-all", "comtypes",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--hidden-import", "comtypes.client",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "desktop.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if (-not (Test-Path "dist\NexaAI\NexaAI.exe")) { throw "Desktop application EXE was not produced." }
          if (-not (Test-Path "build-assets\ollama\ollama.exe")) { throw "Bundled Ollama executable is missing." }
          if (-not (Test-Path "build-assets\ollama-models\manifests")) { throw "Bundled Gemma model manifest is missing." }

      - name: Prepare Gemma license acceptance and redistribution notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $licenseDir = Join-Path $PWD "licenses"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          $termsPath = Join-Path $licenseDir "GEMMA_TERMS_OF_USE.txt"
          $policyPath = Join-Path $licenseDir "GEMMA_PROHIBITED_USE_POLICY.txt"
          $agreementPath = Join-Path $licenseDir "GEMMA_INSTALLER_LICENSE.txt"
          $noticePath = Join-Path $licenseDir "GEMMA-NOTICE.txt"

          Invoke-WebRequest -Uri "https://gemma.ai/resources/terms.md.txt" -OutFile $termsPath
          Invoke-WebRequest -Uri "https://gemma.ai/resources/prohibited-use.md.txt" -OutFile $policyPath
          if ((Get-Item $termsPath).Length -lt 4000) { throw "The official Gemma Terms download looks incomplete." }
          if ((Get-Item $policyPath).Length -lt 1000) { throw "The official Gemma Prohibited Use Policy download looks incomplete." }

          $agreement = @"
NEXAAI GEMMA MODEL INSTALLATION AGREEMENT

NexaAI includes Google Gemma 3 1B model weights. By selecting "I accept the agreement" in this installer and continuing, you agree that your use, reproduction and distribution of Gemma is subject to the complete Gemma Terms of Use and the Gemma Prohibited Use Policy reproduced below. In particular, you must comply with all use restrictions in Section 3.2 of the Gemma Terms of Use. These model terms apply to Gemma only and do not replace the separate notices for other NexaAI components.

==================== COMPLETE GEMMA TERMS OF USE ====================

$(Get-Content -Path $termsPath -Raw)

==================== GEMMA PROHIBITED USE POLICY ====================

$(Get-Content -Path $policyPath -Raw)
"@
          Set-Content -Path $agreementPath -Value $agreement -Encoding utf8
          Set-Content -Path $noticePath -Value "Gemma is provided under and subject to the Gemma Terms of Use found at gemma.ai/resources/terms" -Encoding utf8
          Write-Host "Prepared official Gemma terms, prohibited-use policy, installer acceptance text and model notice."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click Windows installer with offline AI included
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler "installer\NexaAI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Get-ChildItem output -Filter "NexaAI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Nexa AI installer was not produced." }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List | Out-File "output\SHA256.txt"
          Get-Item $installer.FullName | Select-Object Name,Length | Format-List

      - name: Upload installable software
        uses: actions/upload-artifact@v4
        with:
          name: NexaAI-Windows-x64-Offline-Installer
          path: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is the latest main commit
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main"
          if ($latest.sha -eq $env:GITHUB_SHA) {
            "is_latest=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Skipping release publish: a newer main commit exists."
            "is_latest=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release with installer
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v2.0.0
          name: Nexa AI Desktop v2.0.0 — Fully Bundled Gemma Offline
          body: |
            NexaAI 2.0.0 is a fully offline Windows x64 assistant. The single setup installer includes the Ollama Windows runtime and Google Gemma 3 1B model. There is no separate Ollama installation, cloud provider, API key or first-run model download. The installer copies the bundled model into the current Windows user's NexaAI engine folder, then launches the app.

            The bundled local engine uses a private app-specific port and keeps chat content on this PC. Whisper base speech recognition is still downloaded on first voice use; that optional voice download is separate from the bundled chat model.

            The refreshed interface includes premium themed dropdowns, a cleaner offline model badge, a more spacious navigation panel, local chat history, follow-up queue, quick/balanced/detailed response profiles, voice tools, plugin manager and n8n Workflow Studio. Gemma 3 1B is compact and CPU-friendly, but less capable than larger models on complex multi-file coding tasks.
          files: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          draft: false
          prerelease: false
          make_latest: true
