name: Build Nexa AI 2.1.3 Windows Offline Qwen 3B Installer

concurrency:
  group: nexa-ai-windows-installer-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop.py"
      - "nexa_ai/**"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"
      - "tests/**"
      - "tools/**"
      - "assets/**"
      - "plugin-template/**"
      - "plugins/**"
      - "README.md"
      - "THIRD-PARTY-NOTICES.txt"

permissions:
  contents: write
  actions: write

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
          python tools/build_icon.py
          if (-not (Test-Path "assets/nexa-ai.ico")) { throw "NTech app icon was not generated." }

      - name: Compile and run unit tests
        run: |
          python -m compileall -q nexa_ai desktop.py tools/build_icon.py tools/smoke_test_runtime.py
          python -m unittest discover -s tests -v

      - name: Download and verify embedded Ollama standalone CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildAssets = Join-Path $PWD "build-assets"
          $ollamaDir = Join-Path $buildAssets "ollama"
          New-Item -ItemType Directory -Force -Path $ollamaDir | Out-Null

          $zipPath = Join-Path $env:TEMP "ollama-windows-amd64.zip"
          $url = "https://github.com/ollama/ollama/releases/download/v0.11.10/ollama-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $expectedHash = "e87a70728ce6298a48f8f19366508e8bd168d904c736c2a11620229d445e1846"
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Ollama runtime checksum mismatch: $actualHash" }

          Expand-Archive -Path $zipPath -DestinationPath $ollamaDir -Force
          $ollamaExe = Join-Path $ollamaDir "ollama.exe"
          if (-not (Test-Path $ollamaExe)) { throw "The official Ollama standalone package did not contain ollama.exe at its root." }
          & $ollamaExe --version
          if ($LASTEXITCODE -ne 0) { throw "The bundled Ollama CLI failed its version check." }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ollama/ollama/v0.11.10/LICENSE" -OutFile (Join-Path $ollamaDir "LICENSE")
          Write-Host "Verified embedded Ollama CLI. Qwen2.5-Coder 3B is downloaded automatically by NexaAI on first launch with visible progress."

      - name: Build self-contained desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyinstallerArgs = @(
            "--noconfirm", "--clean", "--windowed", "--onedir", "--name", "NexaAI",
            "--icon", "assets/nexa-ai.ico",
            "--collect-all", "fastapi",
            "--collect-all", "uvicorn",
            "--collect-all", "pydantic",
            "--collect-all", "pypdf",
            "--collect-all", "multipart",
            "--collect-all", "imageio_ffmpeg",
            "--collect-all", "faster_whisper",
            "--collect-all", "ctranslate2",
            "--collect-all", "av",
            "--collect-all", "sounddevice",
            "--collect-all", "_sounddevice_data",
            "--collect-all", "pyttsx3",
            "--collect-all", "comtypes",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--hidden-import", "comtypes.client",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "desktop.py"
          )
          python -m PyInstaller @pyinstallerArgs
          if (-not (Test-Path "dist\NexaAI\NexaAI.exe")) { throw "Desktop application EXE was not produced." }
          if (-not (Test-Path "build-assets\ollama\ollama.exe")) { throw "Bundled Ollama executable is missing." }

      - name: Prepare Qwen Research License and required attribution notice
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $licenseDir = Join-Path $PWD "licenses"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          $modelLicense = Join-Path $licenseDir "QWEN-RESEARCH-LICENSE.txt"
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-Coder-3B/resolve/main/LICENSE" -OutFile $modelLicense
          if ((Get-Item $modelLicense).Length -lt 6000) { throw "The Qwen Research License download looks incomplete." }
          $modelNotice = Join-Path $licenseDir "QWEN-NOTICE.txt"
          Set-Content -Path $modelNotice -Value "Qwen is licensed under the Qwen RESEARCH LICENSE AGREEMENT, Copyright (c) Alibaba Cloud. All Rights Reserved." -Encoding utf8
          Write-Host "Prepared the Qwen Research License and required attribution notice."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click Windows installer with bundled Ollama
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler "installer\NexaAI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Get-ChildItem output -Filter "NexaAI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Nexa AI installer was not produced." }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List | Out-File "output\SHA256.txt"
          Get-Item $installer.FullName | Select-Object Name,Length | Format-List

      - name: Upload installable software
        uses: actions/upload-artifact@v4
        with:
          name: NexaAI-Windows-x64-Offline-Installer
          path: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is the latest main commit
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main"
          if ($latest.sha -eq $env:GITHUB_SHA) {
            "is_latest=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Skipping release publish: a newer main commit exists."
            "is_latest=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release with installer
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v2.1.3
          name: Nexa AI Desktop v2.1.3 — Offline Qwen + Chat Display Fix
          body: |
            NexaAI 2.1.3 is an offline-only Windows x64 assistant powered by Qwen2.5-Coder 3B. The setup installer includes the Ollama standalone runtime. On first launch, NexaAI downloads the model (about 1.9 GB) into its private model folder with visible progress. No cloud AI provider, API key or account is included or required. After the first download, chats and supported attachments remain on this PC. Qwen2.5-Coder 3B is restricted to non-commercial research or evaluation by its license.

            The bundled local engine uses a private app-specific port and keeps chat content on this PC. Whisper base speech recognition is still downloaded on first voice use; that optional voice download is separate from the bundled chat model.

            The chat display now shows a visible Thinking state, keeps streamed text while generating, and re-renders the complete final answer after generation. Message height is recalculated after wrapping and resizing to prevent clipped or missing lines. The composer supports Enter-to-send and Shift+Enter for new lines. The workspace keeps local history, follow-up queue, expanded Quick/Balanced/Detailed response limits, voice tools, plugin manager and n8n Workflow Studio. The Qwen 3B model is licensed for non-commercial research/evaluation only; commercial use requires a separate license from Alibaba Cloud.
          files: |
            output/NexaAI-Setup-*.exe
            output/SHA256.txt
          draft: false
          prerelease: false
          make_latest: true
